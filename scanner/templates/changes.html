<!DOCTYPE html>
<html>
<head>
  <title>Detected Changes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <div class="container">
    <h2>Detected Changes</h2>
    {% for diff in changed_pages %}
      <div class="alert alert-warning mb-2">
        <strong>{{ diff.url }}</strong><br>
        <small>Old Hash:</small> {{ diff.previous.pageHash }}<br>
        <small>New Hash:</small> {{ diff.latest.pageHash }}
        <div class="mt-2 border p-2 bg-light">
          {{ diff.diff|safe }}
        </div>
      </div>
    {% empty %}
      <p class="text-muted">No changes detected.</p>
    {% endfor %}
    <a href="{% url 'scanner:status' website_id %}" class="btn btn-secondary mt-4">⬅ Back</a>
  </div>
</body>
</html>
