<!DOCTYPE html>
<html>
<head>
  <title>Page Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <div class="container">
    <h2>HTML Snapshot</h2>
    <p><strong>URL:</strong> {{ page.url }}</p>
    <pre class="bg-light p-3 border rounded" style="max-height: 500px; overflow: auto;">
      {{ page.html|escape }}
    </pre>
    <a href="{% url 'scanner:status' page.website.uid %}" class="btn btn-secondary mt-3">⬅ Back</a>
  </div>
</body>
</html>
